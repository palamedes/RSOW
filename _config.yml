title: Random String of Words
description: Jason Ellis — Developer, Hobbyist, Opinionated Human
url: https://randomstringofwords.com
baseurl: ""

permalink: /post/:title/

# Fallback image for posts without a featured image
default_image: /assets/images/rsow-default.jpg

# Build
markdown: kramdown
sass:
  style: compressed

# Pagination
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  sort_reverse: true

# Archives (replaces old category/tag index generators)
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive
    tag: archive
  permalinks:
    category: /category/:name/
    tag: /tag/:name/

# Collections
collections:
  games:
    output: true
  pages:
    output: true
    # Keep page URLs at the site root (e.g. /hire/) instead of /pages/hire/.
    # Per-page `permalink:` front matter still overrides this.
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: games
    values:
      layout: room

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate-v2

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - image-prompts.md
