title: Random String of Words
description: Jason Ellis — Developer, Hobbyist, Opinionated Human
url: https://randomstringofwords.com
baseurl: ""

# Dates without an offset are Eastern, and "future" posts publish at
# midnight Eastern (the daily scheduled deploy picks them up).
timezone: America/New_York

permalink: /post/:title/

# Author of every page: jekyll-seo-tag puts this in each page's structured
# data (schema.org BlogPosting author), and `social` adds the profile links
# (sameAs) to the homepage's. Search and answer engines use both to tie the
# writing to one known person.
author:
  name: Jason Ellis
  url: https://randomstringofwords.com/about/
social:
  name: Jason Ellis
  links:
    - https://github.com/palamedes
    - https://www.linkedin.com/in/jasonellis
    - https://twitter.com/JasonEllis72
    - https://www.youtube.com/c/JasonEllisBuilds/
    - https://www.facebook.com/jason.r.ellis

# Fallback image for posts without a featured image
default_image: /assets/images/rsow-default.jpg

# Google Search Console site verification (emitted by jekyll-seo-tag as
# <meta name="google-site-verification" ...> in every page head).
google_site_verification: wHMVNxhYpUZWA4VUYdvlrg6ib6CnrzZDdnMocpelhm0

# Comments — giscus (GitHub Discussions). Comments render on a post only when
# repo_id AND category_id below are filled in (get them from https://giscus.app
# after enabling Discussions on the repo + installing the giscus GitHub App).
# Per-post opt-out: set `allow_comments: false` in the post's front matter.
giscus:
  repo: "palamedes/RSOW"
  repo_id: "R_kgDOSCxkQg"
  category: "Announcements"
  category_id: "DIC_kwDOSCxkQs4DA_7k"
  mapping: "pathname"
  strict: 1
  reactions_enabled: 0
  input_position: "top"
  loading: "lazy"

# Build
markdown: kramdown
sass:
  style: compressed

# Pagination
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  sort_reverse: true

# Archives (replaces old category/tag index generators)
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive
    tag: archive
  permalinks:
    category: /category/:name/
    tag: /tag/:name/

# Collections
collections:
  games:
    output: true
  # Short, linkable explainers — /explain/:name/. Deliberately not posts: they
  # aren't dated, aren't chronological, and shouldn't land in the blog archive
  # or the feed.
  explainers:
    output: true
    permalink: /explain/:name/
  pages:
    output: true
    # Keep page URLs at the site root (e.g. /hire/) instead of /pages/hire/.
    # Per-page `permalink:` front matter still overrides this.
    permalink: /:path/
  # /build/ — the "work with me" section. One file per case study; the work
  # grid, service pages and detail pages read from here. Settings and copy
  # live in _data/build.yml.
  build_work:
    output: true
    permalink: /build/work/:name/
  # Tinkered Tactile — the maker-shop site at /tinkered-tactile/. One file per
  # piece of work; the gallery, category pages and detail pages all read from
  # here. See _tools/README-tinkered-tactile.md.
  tt_work:
    output: true
    permalink: /tinkered-tactile/work/:name/
  # Things actually for sale right now, listed on /tinkered-tactile/for-sale/.
  # No pages of their own: items come and go.
  tt_inventory:
    output: false

defaults:
  - scope:
      path: ""
      type: games
    values:
      layout: room
  # Posts manage their own wrappers (full-bleed hero + contained body)
  - scope:
      path: ""
      type: posts
    values:
      full_width: true
  - scope:
      path: ""
      type: explainers
    values:
      layout: explainer
      full_width: true
  - scope:
      path: ""
      type: tt_work
    values:
      layout: tt-work
  - scope:
      path: ""
      type: build_work
    values:
      layout: build-work
      sitemap: false
  # /build/ is unlisted until it launches: keep it out of the sitemap too
  # (the layout adds noindex and the ?p= gate).
  - scope:
      path: "build"
    values:
      sitemap: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-paginate-v2

# Exclude from build
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
