<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 100" width="304" height="100" font-family="Nunito Sans, Arial, Helvetica, sans-serif">
  <!-- Word-card figure for "ultramafic": typical igneous rocks by silica
       content (Britannica averages), lightest and most silica-rich on the
       left. Only the 45% line is drawn; other boundaries vary by scheme. -->
  <path d="M259 2h12l-6 7z" fill="#d9a400"/>
  <text x="224" y="9" font-size="9" font-weight="700" fill="#8a6d00" text-anchor="middle">45%</text>
  <line x1="224" y1="12" x2="224" y2="71" stroke="#d9a400" stroke-width="1.4" stroke-dasharray="3 2.5"/>

  <rect x="0" y="13" width="66" height="56" rx="6" fill="#efe3cf" stroke="#d6c4a3"/>
  <rect x="70" y="13" width="82" height="56" rx="6" fill="#b9a88d"/>
  <rect x="156" y="13" width="66" height="56" rx="6" fill="#5b5650"/>
  <rect x="227.25" y="14.25" width="75.5" height="53.5" rx="5.5" fill="#3e4b30" stroke="#d9a400" stroke-width="2.5"/>

  <g font-size="10" font-weight="800" text-anchor="middle">
    <text x="33" y="29" fill="#3a3120">Felsic</text>
    <text x="111" y="29" fill="#2b2410">Intermediate</text>
    <text x="189" y="29" fill="#f7f1e3">Mafic</text>
    <text x="265" y="29" fill="#fff6d2">Ultramafic</text>
  </g>
  <g font-size="9.5" font-style="italic" text-anchor="middle">
    <text x="33" y="43" fill="#5a4c30">granite</text>
    <text x="111" y="43" fill="#3a3120">diorite</text>
    <text x="189" y="43" fill="#e4dccb">basalt</text>
    <text x="265" y="43" fill="#e8e2c8">peridotite</text>
  </g>
  <g font-size="9.5" font-weight="800" text-anchor="middle">
    <text x="33" y="60" fill="#3a3120">~72% silica</text>
    <text x="111" y="60" fill="#2b2410">~59% silica</text>
    <text x="189" y="60" fill="#f7f1e3">~48% silica</text>
    <text x="265" y="60" fill="#ffd21e">~41% silica</text>
  </g>

  <g stroke="#9a8340" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 80h296"/>
    <path d="M9 76l-5 4 5 4M295 76l5 4-5 4"/>
  </g>
  <g font-size="9.5" fill="#6b5a2c">
    <text x="0" y="95">more silica · lighter</text>
    <text x="304" y="95" text-anchor="end">more iron + magnesium · heavier</text>
  </g>
</svg>
