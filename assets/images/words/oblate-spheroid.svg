<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 110" width="304" height="110" font-family="Nunito Sans, Arial, Helvetica, sans-serif">
  <!-- Word-card figure for "oblate spheroid": Earth bulges at the equator.
       Diameters from NASA's Earth fact sheet (radii 6,378.137 and 6,356.752 km).
       The real flattening (about 1 part in 298) is far too small to see, so the
       drawing exaggerates it; the dashed circle is a perfect sphere for scale. -->
  <circle cx="60" cy="55" r="51" fill="none" stroke="#b39b5a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <ellipse cx="60" cy="55" rx="51" ry="40" fill="#d9ebf3" stroke="#3f7ea6" stroke-width="1.6"/>
  <g stroke-linecap="round" fill="none">
    <path d="M11 55h98" stroke="#2b6f96" stroke-width="1.6"/>
    <path d="M16 51.5 11 55l5 3.5M104 51.5l5 3.5-5 3.5" stroke="#2b6f96" stroke-width="1.6"/>
    <path d="M60 17v76" stroke="#7a6420" stroke-width="1.4"/>
    <path d="M56.5 22 60 17l3.5 5M56.5 88l3.5 5 3.5-5" stroke="#7a6420" stroke-width="1.4"/>
  </g>
  <g font-size="8.5" font-weight="800" fill="#7a6420">
    <text x="65" y="25">N</text>
    <text x="65" y="92">S</text>
  </g>

  <g fill="#3a3120">
    <text x="128" y="20" font-size="9.5" font-weight="800" fill="#2b6f96">Across the equator</text>
    <text x="128" y="32" font-size="9.5">12,756 km</text>
    <text x="128" y="50" font-size="9.5" font-weight="800" fill="#7a6420">Pole to pole</text>
    <text x="128" y="62" font-size="9.5">12,714 km</text>
    <text x="128" y="82" font-size="10" font-weight="800">~43 km (27 mi) fatter</text>
    <text x="128" y="94" font-size="9.5">around the middle</text>
  </g>
  <text x="128" y="108" font-size="8.5" font-style="italic" fill="#9a8340">Squash exaggerated so you can see it</text>
</svg>
