word: aquifer
say: AK-wuh-fer
pos: noun
topic: geology
definition: >-
  An underground layer of rock, sand or gravel that holds water and lets it
  flow to wells and springs. Pumping it faster than rain and snowmelt refill
  it lowers the water table, and some aquifers take thousands of years to
  recharge.
origin: >-
  Latin aqua, "water," + -fer, "carrying."
forms: [aquifer]
