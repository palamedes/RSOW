word: toxic masculinity
say: TOK-sik mas-kyuh-LIN-ih-tee
pos: noun phrase
topic: psychology
definition: >-
  A label for ideas about manhood seen as harmful to men and those around
  them, such as hiding emotions, never asking for help, and proving strength
  through dominance or aggression. Users say it targets those norms, not men;
  critics say it's often used to fault masculinity itself.
origin: >-
  Took hold in the mythopoetic men's movement of the 1980s and 1990s, whose
  writers contrasted it with a "deep" masculinity they felt men had lost.
