word: mmHg
say: MIL-ih-mee-terz uv MUR-kyuh-ree
pos: abbreviation
topic: medicine
definition: >-
  Millimeters of mercury, the standard unit for blood pressure: how high, in
  millimeters, that pressure could push a column of mercury. The American
  Heart Association counts adult readings below 120/80 mmHg as normal.
origin: >-
  Hg is mercury's chemical symbol, from Latin hydrargyrum, “water-silver.”
forms: [mmhg]
