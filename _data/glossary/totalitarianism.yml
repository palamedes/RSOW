word: totalitarianism
say: toh-tal-ih-TAIR-ee-uh-niz-um
pos: noun
topic: politics
definition: >-
  Rule by a single party or leader that seeks total control over public and
  private life, tolerating no opposition and enforcing loyalty through
  propaganda, surveillance and terror. It goes further than authoritarianism,
  which mainly demands political obedience.
origin: >-
  Italian totalitario, coined in 1923 by an opponent of Mussolini, then
  adopted by the Fascists.
