word: social proof
say: SOH-shul PROOF
pos: noun phrase
topic: psychology
definition: >-
  The tendency to treat what other people are doing as evidence of what's
  right or worth doing: the line outside a restaurant, the view count, the
  number of likes.
origin: >-
  Coined by psychologist Robert Cialdini in his 1984 book Influence.
forms: [social proof]
