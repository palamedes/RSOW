word: puberty blocker
say: PYOO-ber-tee BLOK-er
pos: noun phrase
topic: medicine
definition: >-
  A drug that pauses the hormonal changes of puberty for as long as it's
  taken. Doctors have long used them for children who start puberty far too
  early, and some prescribe them to minors with gender dysphoria.
forms: [puberty blocker]
