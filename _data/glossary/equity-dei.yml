word: equity
say: EK-wih-tee
pos: noun
topic: politics
definition: >-
  In diversity policy, fairness measured by outcomes rather than identical
  treatment: adjusting support or resources to people's different
  circumstances so results come out more equal. It's often contrasted with
  equality, which means treating everyone the same.
origin: >-
  Latin aequitas, “evenness, fairness,” from aequus, “equal.”
forms: [equity]
