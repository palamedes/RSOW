word: service connection
say: SUR-vis kuh-NEK-shun
pos: noun phrase
topic: law
definition: >-
  In VA disability claims, the official finding that a veteran's condition
  began during, or was worsened by, military service: a prerequisite for
  compensation. It usually takes a current diagnosis, an in-service injury or
  event, and a medical link between them.
forms: [service connection, service connected]
