word: multimeter
say: MUL-tee-mee-ter
pos: noun
topic: technology
definition: >-
  A handheld meter for electrical troubleshooting that measures voltage,
  current and resistance, so you can tell whether a wire is live, a battery is
  dead or a circuit is broken.
origin: >-
  multi- (“many”) + meter: several measuring tools in one box.
