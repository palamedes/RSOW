word: morality play
say: muh-RAL-ih-tee PLAY
pos: noun phrase
topic: history
definition: >-
  A story or situation framed as a simple contest between good and evil, with
  an obvious moral lesson. Originally a kind of play whose characters stood
  for virtues and vices.
origin: >-
  Morality plays flourished in Europe in the 1400s and 1500s.
forms: [morality play]
