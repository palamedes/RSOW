word: proletariat
say: proh-luh-TAIR-ee-ut
pos: noun
topic: politics
definition: >-
  In Marxist theory, the working class: people who own no means of production
  and live by selling their labor for wages. The Communist Manifesto casts it
  as the class destined to overthrow capitalism and rule.
origin: >-
  Latin proletarius, Rome's lowest class, who served the state mainly by
  having children (proles).
