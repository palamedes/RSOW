word: bile acid diarrhea
say: BYLE AS-id dye-uh-REE-uh
pos: noun phrase
topic: medicine
definition: >-
  Watery diarrhea caused by bile acids that the small intestine fails to
  reabsorb. When they reach the colon they pull in water and speed things up.
  Gallbladder removal is one known cause, and bile-acid-binding drugs usually
  help.
forms: [bile acid diarrhea]
