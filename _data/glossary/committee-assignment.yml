word: committee assignment
say: kuh-MIT-ee uh-SYNE-ment
pos: noun phrase
topic: politics
definition: >-
  In Congress, a member's seats on committees, the small panels that write,
  amend and screen bills in areas like taxes, defense or spending. Senior
  members tend to get the most powerful seats and the chairmanships, so
  staying in office brings more power.
forms: [committee assignment]
