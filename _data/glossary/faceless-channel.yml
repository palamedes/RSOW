word: faceless channel
say: FAYSS-lis CHAN-ul
pos: noun phrase
topic: technology
definition: >-
  A video channel, especially on YouTube, whose creator never appears on
  camera, pairing narration with stock footage, animation or stills. With
  nobody to film, the format is easy to mass-produce, including with AI-
  written scripts and synthetic voices.
forms: [faceless channel]
