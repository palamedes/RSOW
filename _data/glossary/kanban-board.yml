word: kanban board
say: KAHN-bahn BORD
pos: noun phrase
topic: technology
definition: >-
  A task board divided into columns for each stage of work, such as To Do, In
  Progress and Done. Each task is a card that moves across the columns as the
  work advances.
origin: >-
  Japanese kanban, “signboard”; the method began on Toyota's factory floors.
forms: [kanban board]
