word: hydrothermal
say: hy-druh-THUR-mul
pos: adjective
topic: geology
definition: >-
  Having to do with water heated deep underground, usually by magma, that
  circulates through cracks in rock, dissolving and depositing minerals as it
  goes. On the seafloor, it gushes out of hydrothermal vents.
origin: >-
  Greek hydro- (“water”) + thermos (“hot”).
