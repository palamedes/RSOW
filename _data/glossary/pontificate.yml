word: pontificate
say: pon-TIF-ih-kayt
pos: verb
topic: language
definition: >-
  To hold forth with your opinions in a pompous, know-it-all way, as if they
  were beyond question.
origin: >-
  From Latin pontifex, a high priest of ancient Rome and later a title of the
  pope. The word is traditionally read as "bridge-maker," from pons ("bridge")
  + facere ("to make").
forms: [pontificate, pontificates, pontificated, pontificating]
