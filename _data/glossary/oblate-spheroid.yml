word: oblate spheroid
say: OB-layt SFEER-oyd
pos: noun phrase
topic: physics
definition: >-
  A ball squashed slightly at the poles so it bulges around the equator. Earth
  is shaped this way because it spins: it's about 43 km (27 miles) wider
  through the equator than from pole to pole.
forms: [oblate spheroid]
figure: oblate-spheroid
figure_alt: >-
  A circle beside an ellipse flattened at the poles, labeled with Earth's
  equatorial diameter of 12,756 km and polar diameter of 12,714 km, with the
  flattening exaggerated so it can be seen.
