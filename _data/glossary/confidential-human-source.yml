word: confidential human source
say: kon-fih-DEN-shul HYOO-mun SORSS
pos: noun phrase
topic: law
definition: >-
  The FBI's term for an informant: a person who secretly gives the bureau
  information, often about people they know, and may be paid for it. They
  aren't FBI employees, and the bureau keeps their identities secret.
forms: [confidential human source]
