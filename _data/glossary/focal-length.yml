word: focal length
say: FOH-kul LENGTH
pos: noun phrase
topic: photography
definition: >-
  How strongly a lens magnifies, measured in millimeters: roughly the distance
  from the lens's optical center to the sensor when focused far away. Short
  focal lengths take in a wide scene; long ones (telephoto) bring distant
  subjects close.
origin: >-
  Latin focus, “hearth”; Kepler used it in 1604 for the point where light rays
  meet.
forms: [focal length]
