word: special counsel
say: SPESH-ul KOWN-sul
pos: noun phrase
topic: law
definition: >-
  A lawyer from outside the government whom the attorney general appoints to
  investigate, and possibly prosecute, a matter the Justice Department can't
  fairly handle itself, often one involving senior officials. The work ends
  with a confidential report to the attorney general explaining whether to
  charge anyone.
origin: >-
  The current Justice Department rules date from 1999, when the independent
  counsel law expired.
forms: [special counsel]
