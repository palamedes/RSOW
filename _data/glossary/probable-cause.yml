word: probable cause
say: PRAH-buh-bul KAWZ
pos: noun phrase
topic: law
definition: >-
  The standard police must meet to get a warrant or make an arrest: facts that
  would lead a reasonable person to believe a suspect committed a crime, or
  that evidence of one will be found where police want to search.
origin: >-
  Written into the Fourth Amendment: no warrants shall issue “but upon
  probable cause.”
forms: [probable cause]
