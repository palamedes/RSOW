word: disability rating
say: dis-uh-BIL-ih-tee RAY-ting
pos: noun phrase
topic: law
definition: >-
  The percentage, 0 to 100 in steps of 10, that the VA assigns to a service-
  connected condition to reflect its average impact on earning capacity.
  Ratings set monthly compensation; a 0% rating recognizes the condition but
  pays nothing.
forms: [disability rating]
