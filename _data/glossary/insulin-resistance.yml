word: insulin resistance
say: IN-suh-lin rih-ZIS-tunss
pos: noun phrase
topic: medicine
definition: >-
  A state in which muscle, fat and liver cells respond poorly to insulin, the
  hormone that helps clear sugar from the blood, so the pancreas has to make
  more to keep blood sugar in range. It can lead to type 2 diabetes.
origin: >-
  Insulin is from Latin insula, “island,” after the pancreatic islets that
  make it.
forms: [insulin resistance]
