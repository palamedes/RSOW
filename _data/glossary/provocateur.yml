word: provocateur
say: pruh-vok-uh-TUR
pos: noun
topic: politics
definition: >-
  Someone who stirs up trouble on purpose. An "agent provocateur" is a person
  planted by police or a government to push a group into breaking the law,
  so its members can be arrested or discredited.
origin: >-
  French, "one who provokes."
forms: [provocateur]
