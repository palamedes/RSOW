word: telemetry
say: tuh-LEM-ih-tree
pos: noun
topic: technology
definition: >-
  Data that software collects automatically about how it's used and how it
  performs, such as crash reports, hardware details and which features get
  used, and sends back to the company that makes it.
origin: >-
  Greek tele (“far off”) + metron (“measure”): measuring from a distance.
