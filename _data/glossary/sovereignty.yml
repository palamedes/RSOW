word: sovereignty
say: SOV-ruhn-tee
pos: noun
topic: politics
definition: >-
  Supreme authority over a territory and the people in it: the power to make and
  enforce laws without answering to an outside power. Tribal sovereignty is the
  limited self-government U.S. law recognizes for Native nations.
origin: >-
  From Old French souverain, "highest, supreme," from Latin super, "above."
forms: [sovereignty]
