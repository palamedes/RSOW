word: grain
say: GRAYN
pos: noun
topic: physics
definition: >-
  A small unit of weight used for bullets and gunpowder: 1/7,000 of a pound,
  or about 65 milligrams. A 55-grain bullet weighs about 3.6 grams; a
  150-grain bullet, about 9.7 grams.
origin: >-
  Originally based on the weight of a single grain of wheat or barley.
forms: [grain]
