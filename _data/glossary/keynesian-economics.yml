word: Keynesian economics
say: KAYN-zee-un ek-uh-NOM-iks
pos: noun phrase
topic: economics
definition: >-
  The school of thought, from British economist John Maynard Keynes, that
  total spending drives output and jobs in the short run, so governments
  should spend more or tax less in a slump and pull back in a boom.
forms: [Keynesian economics]
