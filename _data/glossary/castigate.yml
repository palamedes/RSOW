word: castigate
say: KAS-tih-gayt
pos: verb
topic: language
definition: >-
  To criticize or scold someone severely, usually in public.
origin: >-
  From Latin castigare, "to correct or punish", literally "to make pure" (castus,
  "pure"). Chastise comes from the same Latin word.
forms: [castigate, castigated, castigating]
