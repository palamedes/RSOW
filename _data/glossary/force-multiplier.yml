word: force multiplier
say: FORSS MUL-tih-ply-er
pos: noun phrase
topic: military
definition: >-
  Something that greatly increases what a person or group can accomplish
  without adding more people, so the same effort achieves far more.
origin: >-
  Military jargon for anything, like better technology or training, that
  multiplies a force's combat power.
forms: [force multiplier]
