word: collectivism
say: kuh-LEK-tih-viz-um
pos: noun
topic: politics
definition: >-
  The principle that the group, such as a nation, class or race, comes before
  the individual; a collectivist holds this view. In economics, it means
  ownership and control of property and production by the community or the
  state.
forms: [collectivism, collectivist]
