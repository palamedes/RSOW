word: conspiracy
say: kun-SPEER-uh-see
pos: noun
topic: law
definition: >-
  In criminal law, an agreement between two or more people to commit a crime,
  usually with at least one step taken to carry it out. "Collusion," by
  contrast, isn't a crime in itself under federal law.
origin: >-
  Latin conspirare, "to breathe together."
forms: [conspiracy]
