word: winner-take-all
say: WIN-er tayk AWL
pos: adjective
topic: politics
definition: >-
  A rule that gives all of a contest's prize to whoever finishes first. In
  presidential elections, 48 states and DC give every one of their electoral
  votes to the candidate who wins the state's popular vote; Maine and Nebraska
  split theirs.
forms: [winner-take-all]
