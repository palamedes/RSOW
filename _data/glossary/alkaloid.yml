word: alkaloid
say: AL-kuh-loyd
pos: noun
topic: chemistry
definition: >-
  A large family of nitrogen-containing plant compounds, often bitter and
  biologically potent. Caffeine, nicotine, morphine and quinine are alkaloids,
  and so is solanine, the toxin that builds up in potatoes that have turned
  green.
origin: >-
  alkali + -oid, “alkali-like,” because many of them are weak bases.
