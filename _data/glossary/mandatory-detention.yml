word: mandatory detention
say: MAN-duh-tor-ee dih-TEN-shun
pos: noun phrase
topic: law
definition: >-
  In immigration law, a rule requiring the government to hold certain
  noncitizens in custody while their deportation cases proceed, with no bond
  hearing to seek release. A 1996 law created it for people with certain
  criminal records.
forms: [mandatory detention]
