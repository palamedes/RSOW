word: opposition research
say: op-uh-ZISH-un REE-surch
pos: noun phrase
topic: politics
definition: >-
  Digging into a political rival's record, money, statements and connections
  for damaging information, usually paid for by a campaign or party. It's a
  routine part of campaigns, and the findings are often passed to reporters.
forms: [opposition research, opposition-research]
