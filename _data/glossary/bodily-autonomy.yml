word: bodily autonomy
say: BOD-uh-lee aw-TON-uh-mee
pos: noun phrase
topic: philosophy
definition: >-
  A person's right to decide what happens to their own body, including who
  touches it and how, free from force or pressure from anyone else.
origin: >-
  autonomy, from Greek autos ("self") + nomos ("law"): living by your own
  rules.
