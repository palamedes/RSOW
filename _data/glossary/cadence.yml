word: cadence
say: KAY-dunss
pos: noun
topic: language
definition: >-
  The rhythm and rise and fall of someone's speech: where they speed up, slow
  down and pause, and how their voice lifts or drops at the end of a sentence.
origin: >-
  From Latin cadere, "to fall," for the falling of the voice at the end of a
  phrase.
forms: [cadence]
