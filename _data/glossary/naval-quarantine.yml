word: naval quarantine
say: NAY-vul KWOR-un-teen
pos: noun phrase
topic: military
definition: >-
  A naval cordon that stops certain cargo from reaching a country. The U.S.
  chose the word for its October 1962 cordon around Cuba, which blocked
  shipments of offensive weapons, because a “blockade” is legally an act of
  war.
origin: >-
  Italian quaranta giorni, “forty days,” how long Venice held ships arriving
  from plague ports.
forms: [naval quarantine]
