word: catalytic converter
say: kat-uh-LIT-ik kun-VUR-ter
pos: noun phrase
topic: technology
definition: >-
  The canister in a car's exhaust system that turns the worst pollutants into
  less harmful gases. It works using small amounts of platinum, palladium and
  rhodium, which is why thieves saw them off to sell for scrap.
origin: >-
  Standard on most new U.S. cars from the 1975 model year, to meet Clean Air
  Act emission limits.
forms: [catalytic converter]
