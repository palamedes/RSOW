word: tinnitus
say: TIN-ih-tus
pos: noun
topic: medicine
definition: >-
  Hearing ringing, buzzing, hissing or other sounds in the ears when no
  outside sound is present. Long exposure to loud noise is a leading cause,
  and it's the most common disability the VA compensates.
origin: >-
  Latin, “a ringing,” from tinnire, “to ring or jingle.”
