word: reasonable expectation of privacy
say: REE-zuh-nuh-bul ek-spek-TAY-shun uv PRY-vuh-see
pos: noun phrase
topic: law
definition: >-
  The main test courts use to decide whether police conduct is a Fourth
  Amendment search: it is if it intrudes on privacy that a person actually
  expects and that society is prepared to recognize as reasonable.
origin: >-
  From Justice John Marshall Harlan's concurring opinion in Katz v. United
  States (1967).
forms: [reasonable expectation of privacy, expectation of privacy, reasonable expectation]
