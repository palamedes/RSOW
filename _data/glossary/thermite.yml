word: thermite
say: THUR-myt
pos: noun
topic: chemistry
definition: >-
  A powdered mix of aluminum and iron oxide that burns hot enough to melt
  steel, leaving molten iron behind; railroads use it to weld rails together.
  Thermate is a military variant with barium nitrate and sulfur added.
origin: >-
  German Thermit, from the Greek root therm- (“heat”).
