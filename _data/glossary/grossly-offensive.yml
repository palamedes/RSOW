word: grossly offensive
say: GROHS-lee uh-FEN-siv
pos: adjective phrase
topic: law
definition: >-
  The test in section 127 of the UK's Communications Act 2003, which makes it a
  crime to send such a message over a public network like the internet. The
  law doesn't define it; courts say bad taste, even shockingly bad taste, isn't
  enough.
