word: filibuster
say: FIL-uh-bus-ter
pos: noun
topic: politics
definition: >-
  In the U.S. Senate, using unlimited debate to delay or block a vote on a
  bill. Ending one takes a "cloture" vote, which today needs 60 of the 100
  senators for most legislation.
origin: >-
  From a Dutch word for "freebooter," or pirate, by way of Spanish. It caught
  on in the 1850s for senators who held the floor to stall a bill.
forms: [filibuster]
