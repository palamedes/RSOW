word: boilerplate
say: BOY-ler-playt
pos: noun
topic: technology
definition: >-
  In programming, standard code that has to be written in many places with
  little or no change, such as routine setup, and that does little beyond
  making the real work possible.
origin: >-
  First the rolled steel plate used to build steam boilers; later, stock text
  sent to newspapers on ready-made printing plates.
