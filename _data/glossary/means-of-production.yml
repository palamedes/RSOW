word: means of production
say: MEENZ uv pruh-DUK-shun
pos: noun phrase
topic: economics
definition: >-
  In Marxist theory, the physical resources used to make goods, such as land,
  factories, machinery, tools and raw materials, as distinct from labor and
  from personal belongings. Marx argued that whoever owns them holds economic
  and political power.
forms: [means of production]
