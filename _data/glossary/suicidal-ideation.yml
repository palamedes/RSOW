word: suicidal ideation
say: soo-ih-SY-dul eye-dee-AY-shun
pos: noun phrase
topic: psychology
definition: >-
  The clinical term for thinking about, considering or planning suicide, from
  passing thoughts that life isn't worth living to a detailed plan. Doctors
  treat it as a warning sign that calls for support.
forms: [suicidal ideation]
