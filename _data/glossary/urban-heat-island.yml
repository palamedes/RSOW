word: urban heat island
say: UR-bun HEET EYE-lund
pos: noun phrase
topic: physics
definition: >-
  A city or built-up area that stays noticeably hotter than the countryside
  around it, because pavement, roofs and buildings soak up and give off more
  of the sun's heat, and there's little greenery to cool the air.
forms: [urban heat island]
