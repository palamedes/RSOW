word: liquidity
say: lih-KWID-ih-tee
pos: noun
topic: economics
definition: >-
  How easily something can be turned into cash. Money in a checking account is
  liquid; a house is not, because you can't spend part of it without selling or
  borrowing against it.
origin: >-
  From Latin liquidus, "flowing": assets that flow freely, like cash.
