word: othering
say: UTH-er-ing
pos: noun
topic: psychology
definition: >-
  Treating a person or group as fundamentally different from "us," and
  usually as lesser, which makes their views, needs or humanity easier to
  dismiss.
origin: >-
  Popularized by the literary theorist Gayatri Chakravorty Spivak in a 1985
  essay on how British colonial records portrayed Indians.
