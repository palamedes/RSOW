word: deficit
say: DEF-ih-sit
pos: noun
topic: economics
definition: >-
  A government's shortfall in a single year, when it spends more than it
  collects and borrows to cover the gap. The national debt is the running
  total: every past deficit, minus any surpluses.
origin: >-
  Latin deficit, “it is lacking,” from deficere, “to fail.”
forms: [deficit]
