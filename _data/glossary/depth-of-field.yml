word: depth of field
say: DEPTH uv FEELD
pos: noun phrase
topic: photography
definition: >-
  The zone, from near to far, that looks sharp in a photo. A shallow depth of
  field keeps the subject crisp and blurs the background; a wider aperture
  (lens opening), a closer subject and a bigger sensor all make it shallower.
forms: [depth of field, depth-of-field]
