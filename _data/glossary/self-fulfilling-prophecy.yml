word: self-fulfilling prophecy
say: self-fool-FILL-ing PROF-uh-see
pos: noun phrase
topic: psychology
definition: >-
  A belief or prediction that makes itself come true, because people act on it
  as if it were already true.
origin: >-
  Coined by the sociologist Robert K. Merton in a 1948 essay.
forms: [self-fulfilling prophecy]
