word: penthouse
say: PENT-hows
pos: noun
topic: technology
definition: >-
  In building design, an enclosed structure on a roof that houses machinery
  such as air-conditioning or elevator equipment, rather than a luxury top-
  floor apartment.
origin: >-
  Old French apentis, “attached building,” first meaning a lean-to shed; the
  “house” crept in later.
forms: [penthouse]
