word: systolic
say: sis-TOL-ik
pos: adjective
topic: medicine
definition: >-
  Describes the top number in a blood-pressure reading: the peak pressure in
  the arteries as the heart contracts. The bottom number, diastolic pressure,
  is the lowest point, reached while the heart relaxes between beats.
origin: >-
  Greek systolē, “contraction”; diastolic is from diastolē, “dilation.”
figure: systolic
figure_alt: >-
  A blood-pressure wave over three heartbeats: each peak is the systolic
  pressure, around 120 mmHg, and each low point between beats is the diastolic
  pressure, around 80.
