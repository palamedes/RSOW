word: beyond a reasonable doubt
say: bee-YOND uh REE-zuh-nuh-bul DOWT
pos: phrase
topic: law
definition: >-
  The standard of proof in a criminal trial, the highest in American law. To
  convict, the prosecution must prove every element of the crime so
  thoroughly that jurors are left with no reasonable doubt; if they have one,
  they must acquit.
origin: >-
  The Supreme Court held in In re Winship (1970) that due process requires
  this standard in criminal cases.
forms: [beyond a reasonable doubt]
