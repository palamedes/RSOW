word: narcissistic personality disorder
say: nar-sih-SIS-tik pur-suh-NAL-ih-tee dis-OR-der
pos: noun phrase
topic: psychology
definition: >-
  A clinical diagnosis, not an insult: a lasting pattern of grandiosity, a
  need for admiration and a lack of empathy that starts by early adulthood.
  Diagnosis takes at least five of nine criteria in the DSM-5 manual.
origin: >-
  Named for Narcissus, the young man of Greek myth who fell in love with his
  own reflection.
forms: [narcissistic personality disorder]
