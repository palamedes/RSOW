word: corroborate
say: kuh-ROB-uh-rayt
pos: verb
topic: law
definition: >-
  To back up a claim with separate evidence, such as another witness, a
  document or a record, rather than relying only on the person making it.
origin: >-
  From Latin corroborare, "to strengthen," from robur, "strength" (as in robust).
forms: [corroborate, corroborated, corroboration, corroborating]
