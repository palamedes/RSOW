word: due process
say: DOO PRAH-sess
pos: noun phrase
topic: law
definition: >-
  The constitutional guarantee that government must follow fair, established
  legal procedures, such as notice, a hearing and a neutral judge, before
  taking away a person's life, liberty or property. It appears in the Fifth
  and Fourteenth Amendments.
origin: >-
  “Due process of law” first appears in a 1354 English statute restating Magna
  Carta.
forms: [due process]
