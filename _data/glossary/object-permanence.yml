word: object permanence
say: OB-jekt PUR-muh-nunss
pos: noun phrase
topic: psychology
definition: >-
  In child development, the understanding that things still exist when they
  can't be seen, heard or touched. Babies develop it gradually over roughly
  their first two years.
origin: >-
  From Swiss psychologist Jean Piaget's studies of infants in the 1930s.
forms: [object permanence]
