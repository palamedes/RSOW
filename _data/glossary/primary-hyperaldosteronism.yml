word: primary hyperaldosteronism
say: PRY-mair-ee hy-per-al-DOSS-ter-uh-niz-um
pos: noun phrase
topic: medicine
definition: >-
  A condition in which one or both adrenal glands, which sit atop the kidneys,
  make too much of the hormone aldosterone, so the body holds on to extra
  sodium and water and sheds potassium, raising blood pressure. “Primary”
  means the fault starts in those glands.
forms: [primary hyperaldosteronism]
