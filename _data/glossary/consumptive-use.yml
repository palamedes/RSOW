word: consumptive use
say: kun-SUMP-tiv YOOSS
pos: noun phrase
topic: geology
definition: >-
  Water that's taken and not returned to its source nearby, because it
  evaporated, was taken up by plants, or went into a product. Water that's
  withdrawn and then sent back, like most power-plant cooling water, isn't
  counted as consumed.
forms: [consumptive water use, consumptive use]
