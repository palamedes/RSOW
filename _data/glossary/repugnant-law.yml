word: repugnant
say: rih-PUG-nunt
pos: adjective
topic: law
definition: >-
  In legal writing, in conflict with something, so that both can't stand. A law
  repugnant to the Constitution contradicts it, and since Marbury v. Madison
  (1803) American courts treat such a law as void.
origin: >-
  Latin repugnare, "to fight back," from re- ("back") + pugnare ("to fight").
  The everyday sense, "disgusting," grew from the same idea of opposition.
