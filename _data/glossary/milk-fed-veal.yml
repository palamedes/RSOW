word: milk-fed veal
say: MILK-fed VEEL
pos: noun phrase
topic: general
definition: >-
  Veal from calves raised mainly on a nutritionally balanced milk-based
  formula rather than their mother's milk, also called special-fed veal. U.S.
  producers sell the calves at around six months and 500 pounds or more.
forms: [milk-fed veal]
