word: restricted area
say: rih-STRIK-tid AIR-ee-uh
pos: noun phrase
topic: law
definition: >-
  In federal law, a posted or cordoned-off area around a place where someone
  the Secret Service protects is or will be visiting. On January 6 the Vice
  President's presence made the Capitol grounds one. Knowingly entering
  without permission is a misdemeanor unless a weapon or serious injury is
  involved.
forms: [restricted area, restricted grounds]
