word: muzzle energy
say: MUZ-ul EN-er-jee
pos: noun phrase
topic: physics
definition: >-
  The kinetic energy of a bullet as it leaves the barrel, a common yardstick
  for comparing cartridges. In the U.S. it's given in foot-pounds; one foot-
  pound (about 1.36 joules) is enough to lift one pound one foot.
forms: [muzzle energy]
