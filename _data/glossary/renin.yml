word: renin
say: REE-nin
pos: noun
topic: medicine
definition: >-
  An enzyme the kidneys release when blood pressure, blood volume or sodium
  runs low. It starts a chain reaction that tightens blood vessels and prompts
  the adrenal glands to release aldosterone, which makes the kidneys hold on
  to sodium.
origin: >-
  Latin renes, “kidneys”; named by its discoverers in 1898.
