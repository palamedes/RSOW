word: progressive collapse
say: pruh-GRES-iv kuh-LAPS
pos: noun phrase
topic: technology
definition: >-
  A chain-reaction failure in which damage to one part of a structure spreads
  to the next, each failure overloading its neighbors, until the whole
  structure, or a disproportionately large part of it, comes down.
forms: [progressive structural collapse, progressive collapse]
