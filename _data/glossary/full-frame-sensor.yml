word: full-frame sensor
say: full-FRAYM SEN-ser
pos: noun phrase
topic: photography
definition: >-
  A digital camera sensor the size of a frame of 35 mm film, 36 × 24 mm, and
  many times the area of a phone camera's sensor. The extra size gathers more
  light and makes blurred backgrounds easier to get.
forms: [full-frame sensor]
figure: full-frame-sensor
figure_alt: >-
  Three sensor outlines drawn to the same scale: full frame at 36 by 24 mm,
  APS-C at about 23.5 by 15.6 mm, and a large phone main-camera sensor at
  about 9.8 by 7.3 mm, roughly a twelfth of full frame's area.
