word: furniture
say: FUR-nih-cher
pos: noun
topic: technology
definition: >-
  On a firearm, the stock, grip and handguard: the parts the shooter holds, as
  distinct from the barrel and firing mechanism. Traditionally wooden, now
  often polymer or metal.
origin: >-
  An older gun-trade sense: a muzzleloader's metal trim, such as the butt
  plate and trigger guard.
forms: [furniture]
