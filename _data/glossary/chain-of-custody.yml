word: chain of custody
say: CHAYN uv KUS-tuh-dee
pos: noun phrase
topic: law
definition: >-
  A paper trail showing who had control of evidence or records, such as
  ballots, at every moment from collection to final use. A complete record
  shows nothing could have been added, lost or tampered with along the way.
forms: [chain-of-custody, chain of custody]
