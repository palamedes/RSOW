word: volatile
say: VOL-uh-tul
pos: adjective
topic: chemistry
definition: >-
  In chemistry, describes a substance that evaporates easily at ordinary
  temperatures. Plants give off volatile compounds that drift through the air
  as scents, which is how a plant under attack can summon the predators of
  whatever is chewing on it.
origin: >-
  Latin volatilis, “flying,” from volare, “to fly.”
forms: [volatile]
