word: assault weapon
say: uh-SAWLT WEP-un
pos: noun phrase
topic: law
definition: >-
  In U.S. law, a category of semiautomatic guns (one shot per trigger pull)
  with certain military-style features, such as a pistol grip; definitions
  vary from law to law. Not to be confused with an assault rifle, which can
  fire automatically.
forms: [assault weapon]
