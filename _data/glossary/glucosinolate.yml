word: glucosinolate
say: gloo-koh-SIN-uh-layt
pos: noun
topic: biology
definition: >-
  A sulfur-containing compound in cabbage-family plants such as broccoli,
  kale, Brussels sprouts and mustard. When the plant is chewed or cut, an
  enzyme turns it into pungent chemicals called isothiocyanates: the bite in
  mustard, horseradish and wasabi.
