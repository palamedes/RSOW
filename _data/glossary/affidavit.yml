word: affidavit
say: af-ih-DAY-vit
pos: noun
topic: law
definition: >-
  A written statement someone signs swearing it's true, so that lying in it
  can be punished like lying under oath. Some must be notarized; others just
  need a signature.
origin: >-
  Medieval Latin for "he has declared on oath."
forms: [affidavit]
