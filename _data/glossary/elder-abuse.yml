word: elder abuse
say: EL-dur uh-BYOOS
pos: noun phrase
topic: law
definition: >-
  An intentional act, or a failure to act, that harms or risks harming an
  older adult, usually someone 60 or older. It covers physical, sexual and
  emotional abuse, neglect and financial exploitation, and each state's law
  defines it a little differently.
forms: [elder abuse]
