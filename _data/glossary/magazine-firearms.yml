word: magazine
say: MAG-uh-zeen
pos: noun
topic: technology
definition: >-
  On a firearm, the container, often detachable, that holds cartridges and
  feeds them into the chamber. Magazine bans usually target "high-capacity"
  ones, defined in most such laws as holding more than 10 or 15 rounds.
origin: >-
  From Arabic makhāzin, "storehouses." It meant a store of arms or supplies
  long before it meant a periodical.
forms: [magazine]
