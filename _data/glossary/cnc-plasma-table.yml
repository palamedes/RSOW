word: CNC plasma table
say: see-en-SEE PLAZ-muh TAY-bul
pos: noun phrase
topic: technology
definition: >-
  A computer-controlled machine that cuts shapes out of sheet metal: a plasma
  torch, which melts through metal with a jet of superheated, electrically
  charged gas, follows a programmed path over a flat table. CNC stands for
  computer numerical control.
forms: [cnc plasma table]
