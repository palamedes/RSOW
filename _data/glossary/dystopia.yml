word: dystopia
say: dis-TOH-pee-uh
pos: noun
topic: language
definition: >-
  An imagined society that is as bad as it can be: oppressive, frightening or
  degraded, as in Nineteen Eighty-Four or The Hunger Games. The opposite of a
  utopia.
origin: >-
  Greek dys- ("bad") + topos ("place"), modeled on Thomas More's Utopia; recorded
  in English by 1747 and popularized by John Stuart Mill in 1868.
forms: [dystopia, dystopian]
