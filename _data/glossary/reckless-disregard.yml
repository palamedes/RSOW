word: reckless disregard
say: REK-lis dis-rih-GARD
pos: noun phrase
topic: law
definition: >-
  In defamation law, publishing something while seriously doubting it's true,
  or ignoring obvious reasons to doubt it. With knowing falsehood, it makes up
  the "actual malice" a public figure must prove.
forms: [reckless disregard]
