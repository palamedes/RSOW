word: Fourth Amendment search
say: FORTH uh-MEND-ment SURCH
pos: noun phrase
topic: law
definition: >-
  In constitutional law, government information-gathering that invades a
  reasonable expectation of privacy or physically intrudes on a person, home,
  papers or belongings. If it counts as a search, police generally need a
  warrant; if not, they need none.
forms: [fourth amendment search]
