word: noradrenaline
say: nor-uh-DREN-uh-lin
pos: noun
topic: medicine
definition: >-
  A chemical messenger closely related to adrenaline, also called
  norepinephrine. Nerves of the sympathetic nervous system, which drives the
  “fight or flight” response, release it; it tightens blood vessels and raises
  blood pressure.
origin: >-
  Adrenaline is from Latin ad (“near”) + renes (“kidneys”), after the adrenal
  glands.
forms: [noradrenaline, norepinephrine]
