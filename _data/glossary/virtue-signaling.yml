word: virtue signaling
say: VUR-choo SIG-nuh-ling
pos: noun phrase
topic: politics
definition: >-
  Saying or sharing something mainly to show others you hold the right views or
  are a good person, rather than to accomplish anything. It's almost always used
  as criticism.
origin: >-
  Popularized by British journalist James Bartholomew in a 2015 column in The
  Spectator. "Signaling" borrows from signaling theory in biology and economics.
forms: [virtue signaling, virtue signalling]
