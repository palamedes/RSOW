word: abiotic
say: ay-by-OT-ik
pos: adjective
topic: chemistry
definition: >-
  Not made by, or involving, living things. Abiotic methane, for instance,
  forms from rock, water and heat alone, with no plants, animals or microbes
  anywhere in its history.
origin: >-
  Greek a- (“not”) + biōtikos (“of life”).
forms: [abiotic, abiotically]
