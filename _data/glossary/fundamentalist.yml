word: fundamentalist
say: fun-duh-MEN-tl-ist
pos: noun
topic: general
definition: >-
  Someone who holds strictly to the basic teachings of a religion, often read
  literally, and rejects modern reinterpretation of them. Used more loosely
  for anyone rigidly certain about a belief and hostile to those who differ.
origin: >-
  From The Fundamentals, essays defending core Protestant beliefs published in
  the 1910s; the label is usually credited to Baptist editor Curtis Lee Laws in
  1920.
