word: Puritan work ethic
say: PYOOR-ih-tun WURK ETH-ik
pos: noun phrase
topic: history
definition: >-
  The belief, traced to the Protestant settlers of colonial New England, that
  hard work and self-denial are virtues in themselves and that idleness is a
  moral failing. Also called the Protestant work ethic.
origin: >-
  Popularized by sociologist Max Weber's 1905 book The Protestant Ethic and the
  Spirit of Capitalism.
forms: [Puritan work ethic]
