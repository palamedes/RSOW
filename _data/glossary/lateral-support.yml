word: lateral support
say: LAT-er-ul suh-PORT
pos: noun phrase
topic: technology
definition: >-
  Sideways bracing that keeps a column from bowing out. In a building, the
  floors attached to a column provide it at every story; strip away enough
  floors and the column can buckle, bending sideways and giving way.
origin: >-
  Lateral is from Latin latus, “side.”
forms: [lateral support]
