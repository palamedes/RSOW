word: agnostic
say: ag-NOS-tik
pos: noun, adjective
topic: philosophy
definition: >-
  Someone who holds that whether God exists is unknown, or can't be known. It
  differs from an atheist, who doesn't believe in God, though some people call
  themselves both.
origin: >-
  Coined in 1869 by English biologist Thomas Henry Huxley as the opposite of
  the "gnostics" of early church history, who claimed special knowledge of God.
