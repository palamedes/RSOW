word: CO₂e
say: see-oh-too-EE
pos: abbreviation
topic: chemistry
definition: >-
  Short for carbon dioxide equivalent, a unit for adding different greenhouse
  gases together: each gas is counted as the amount of carbon dioxide that
  would cause the same warming over a set period, usually 100 years.
origin: >-
  CO₂ is carbon dioxide's chemical formula: one carbon atom, two oxygen atoms.
forms: [co₂e, co2e]
