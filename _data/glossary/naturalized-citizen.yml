word: naturalized citizen
say: NACH-er-uh-lyzd SIT-ih-zun
pos: noun phrase
topic: law
definition: >-
  Someone born a citizen of another country who becomes a citizen later. In
  the U.S. that usually means five years as a green-card holder (three if
  married to a citizen), an English and civics test, and an oath of
  allegiance.
forms: [naturalized citizen]
