word: assimilate
say: uh-SIM-uh-layt
pos: verb
topic: politics
definition: >-
  Of immigrants: to become part of a new country's society by taking on its
  language, customs and shared civic values, often over a generation or two.
  It's often contrasted with "integration," which leaves more of a group's
  original culture in place.
origin: >-
  Latin assimilare, "to make like."
forms: [assimilate, assimilation]
