word: ultramafic
say: ul-truh-MAF-ik
pos: adjective
topic: geology
definition: >-
  Describes igneous and meta-igneous rocks that contain very little silica
  (less than 45%) and are packed with dark, heavy minerals rich in iron and
  magnesium. Most of Earth's upper mantle is ultramafic rock called
  peridotite.
origin: >-
  ultra- ("beyond") + mafic, which geologists coined in 1912 from magnesium
  and ferric (iron).
figure: ultramafic
figure_alt: >-
  Four common igneous rocks from lightest to darkest: granite (about 72%
  silica), diorite (about 59%), basalt (about 48%) and peridotite (about 41%),
  with ultramafic rocks falling below the 45% line.
