word: hallucinate
say: huh-LOO-sih-nayt
pos: verb
topic: technology
definition: >-
  Of an AI system: to produce false or invented information, such as a
  nonexistent fact, quote or source, and present it as confidently as if it
  were true.
origin: >-
  Latin (h)alucinari, “to wander in mind.” Cambridge Dictionary's word of the
  year for 2023.
