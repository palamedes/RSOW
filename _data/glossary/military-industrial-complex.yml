word: military-industrial complex
say: MIL-ih-tair-ee in-DUS-tree-ul KOM-pleks
pos: noun phrase
topic: politics
definition: >-
  The web of ties between a nation's armed forces, the defense industry that
  equips them and the politicians who fund both, all with a stake in continued
  or rising military spending.
origin: >-
  Popularized by Dwight Eisenhower's farewell address on January 17, 1961.
forms: [military-industrial complex]
