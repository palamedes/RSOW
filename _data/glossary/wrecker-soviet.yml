word: wrecker
say: REK-er
pos: noun
topic: history
definition: >-
  In the Stalin-era Soviet Union, someone accused of “wrecking”: deliberately
  undermining industry or the economy. The charge was brought widely against
  engineers, managers and officials, often to blame them for failures such as
  missed plan targets.
origin: >-
  Translates Russian vreditel, from vred, “harm”; the word also means a crop
  pest.
forms: [wrecker]
