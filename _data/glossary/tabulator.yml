word: tabulator
say: TAB-yuh-lay-ter
pos: noun
topic: politics
definition: >-
  A machine that scans and counts paper ballots. When voting ends it prints a
  results tape, a long receipt listing its totals, which election workers are
  supposed to check and sign.
origin: >-
  From "tabulate," to arrange figures in a table, from Latin tabula ("board,
  list").
forms: [tabulator]
