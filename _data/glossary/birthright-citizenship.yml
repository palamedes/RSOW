word: birthright citizenship
say: BURTH-rite SIT-uh-zen-ship
pos: noun phrase
topic: law
definition: >-
  Citizenship granted automatically to anyone born in a country's territory.
  In the U.S. it comes from the 14th Amendment, and in 2026 the Supreme Court
  held that it covers children of parents here illegally or temporarily.
forms: [birthright citizenship]
