word: rationalize
say: RASH-uh-nuh-lyze
pos: verb
topic: psychology
definition: >-
  To justify a belief or action, often a troubling one, with reasons that sound
  sensible but aren't the real or sufficient ones.
origin: >-
  The psychoanalyst Ernest Jones gave the word this sense in 1908.
forms: [rationalize, rationalizing, rationalized, rationalization]
