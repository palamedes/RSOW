# Tinkered Tactile — site settings and shared copy for /tinkered-tactile/.
# Anything left blank is a placeholder: it simply doesn't render until filled in.

name: Tinkered Tactile
base: /tinkered-tactile
domain: tinkeredtactile.com
tagline: "Things worth touching. Made worth keeping."
line_make: "You don't have to find exactly what you want. We can probably make it."
line_stuff: "Your design. Your logo. Your idea. We put it on stuff."
location: coastal North Carolina
description: "Tinkered Tactile is a small maker shop in coastal North Carolina: laser engraving, woodturning, layered wood maps, slate, signs and custom one-offs. Bring an idea; we can probably make it."
og_image: /assets/tinkered-tactile/brand/og-default.jpg

# ── Placeholder photos (image names from _data/tt_images.yml) ──────────
# Swap these once there are real shop photos: run _tools/tt-image.sh on the
# photo, then put its name here. hero_caption is the small print in the
# hero's corner; set it to "" for a real photo that needs no explaining.
photos:
  hero: oriental-map
  hero_caption: "Shown: a layered map of Oriental, NC. It’s a render; the real one sold."
  about: lady-liberty-slate           # home page About teaser
  about_page: your-design-slate       # the About page
  closing: cocktail-coasters-2        # "What should we make?" background

# ── Contact (placeholders) ──────────────────────────────────────────────
email: ""
phone: ""
social:
  instagram: ""
  facebook: ""
  youtube: ""
# Where "ready to buy" pieces will eventually sell. A work item can also carry
# its own buy_url, which puts a "Buy it" button on that piece.
shops:
  etsy: ""
  ebay: ""

# ── Project form ────────────────────────────────────────────────────────
# A form-service endpoint (Formspree or similar; it needs file-upload support
# for the attachments). While blank, the form still renders but tells people
# it isn't connected yet instead of pretending to send.
form_endpoint: ""

# ── Analytics ───────────────────────────────────────────────────────────
# provider: goatcounter | plausible | ga4   (blank = no analytics at all)
analytics:
  provider: ""
  id: ""

