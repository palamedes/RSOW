# conversation" line.
rates_note: ""

# ── Process ─────────────────────────────────────────────────────────────
process:
  - title: Talk
    body: Tell me what you're trying to do, in plain language. No spec required. We'll figure out together whether I'm the right fit.
  - title: Plan
    body: I write up what I'd build, in what order, roughly what it costs and how long it takes, so you can decide with real numbers.
  - title: Build
    body: Small, working pieces you can click on, early and often. You see progress every week, not a big reveal at the end.
  - title: Launch & Support
    body: Deployment, monitoring and a handoff written for whoever comes next, whether that's me, your team or a future hire.

# ── How I work (principles, from /hire/) ────────────────────────────────
principles:
  - title: Pragmatic over purist
    body: I love elegant code; I love shipped code more. You'll get the simplest thing that solves the real problem.
  - title: Boring infrastructure
    body: Proven, inexpensive hosting and tools, so your money goes into the product instead of the plumbing.
  - title: Plain English
    body: You'll always know what I'm doing, why and what it costs. No jargon walls, no surprises.
  - title: AI as a power tool
    body: I use modern AI tools every day and I'm faster and more careful for it. Every line still gets reviewed by someone with 25+ years of judgment.
  - title: Calm under pressure
    body: Five years in the Army and years of police patrol leave you very hard to rattle.
  - title: Long-term relationships
    body: Most of the people I've worked with, I've worked with for years. I'd like to be the developer you keep.

# ── FAQ ─────────────────────────────────────────────────────────────────
faq:
  - q: I'm not technical. Can I still work with you?
    a: Absolutely. Most of my best projects started with someone who knew their business cold and had never written a line of code. Describe the problem; translating it into software is my job.
  - q: What do you build with?
    a: Usually Ruby on Rails and PostgreSQL for applications, modern JavaScript where it earns its place, and static sites for content that doesn't need a server. I'll recommend whatever is simplest for your situation, and I'll tell you if that's an off-the-shelf tool instead of custom work.
  - q: Do you use AI to write code?
    a: Yes, as a power tool, the way a woodworker uses a table saw. It makes me faster and lets me spend more time on the parts that need judgment. Nothing ships that I haven't read, tested and understood.
  - q: Where are you?
    a: Oriental, North Carolina. I work remotely and keep a real schedule that overlaps generously with every US time zone.
  - q: How much does it cost?
    a: It depends entirely on what we're building, so every project is quoted after a conversation. The request form asks for a rough budget range so I can suggest an approach that fits it.
  - q: What happens after I send a request?
    a: I read it personally and reply with questions or a time to talk. If I'm not the right fit, I'll say so and, when I can, point you to someone who is.

