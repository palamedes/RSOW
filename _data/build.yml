# ── The elephant in the room: why hire a person when AI writes code ────
ai_question:
  eyebrow: The elephant in the room
  title: Why not just ask an AI?
  lede: >-
    Honestly? For some things, you should, and if that's you, I'll tell you.
    But AI builds the first 80% fast, and the last 20% is where projects die.
  points:
    - title: AI writes code. It doesn't own the result.
      body: >-
        Real users, real data, logins, payments, security, hosting, and the bug
        that shows up in month three. Somebody has to know what's wrong and be
        on the hook to fix it.
    - title: It's confidently wrong.
      body: >-
        AI doesn't know when it's wrong, and it won't tell you. Spotting the
        mistake before it ships takes the judgment you get from shipping
        software since before these tools existed.
    - title: I use it every day.
      body: >-
        You get AI's speed and someone who knows when to overrule it. That makes
        me faster than a developer who won't touch it, and safer than betting
        your business on its guesses.
    - title: If AI alone will do, I'll say so.
      body: >-
        If your project is simple enough for ChatGPT, I'll tell you and point
        you in the right direction. I'd rather earn your trust than bill for
        something you don't need.
  link: More on how I use AI

