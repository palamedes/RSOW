# ── Services ────────────────────────────────────────────────────────────
# key matches the anchors on /build/services/ and the form's checkboxes.
services:
  - key: web-design
    icon: layout
    title: Web Design & UX
    short: Sites and interfaces that are fast, readable and easy to use, on every screen.
    body: >-
      Good design is mostly clarity: what a visitor needs, in the order they need
      it, loading fast and working for everybody. I design and build marketing
      sites, product interfaces and dashboards with accessibility and performance
      treated as requirements, not extras.
    gets:
      - Information architecture and page layouts
      - A responsive, accessible build (keyboard, screen readers, phones)
      - Performance work, so pages load fast on bad connections
      - A design you can keep editing without calling me
    examples: [rsow, tinkered-tactile]

  - key: web-apps
    icon: code
    title: Custom Web Applications
    short: From a napkin idea to a product people log into, pay for and depend on.
    body: >-
      This is my day job. I build web applications in Ruby on Rails with
      PostgreSQL, Hotwire and modern JavaScript where it earns its keep, and I
      take them from first sketch through launch and the years after. Boring,
      dependable infrastructure; interesting product.
    gets:
      - Product scoping that turns "it should do everything" into a first release
      - A Rails application with tests that actually run
      - Accounts, billing, admin tools, background jobs, integrations
      - Deployment, monitoring and a codebase the next developer will thank you for
    examples: [cardinal, media-downloader, home-camera-system]

  - key: ai
    icon: spark
    title: AI Integration & Automation
    short: Practical AI features, agents and automations that do real work, not demos.
    body: >-
      I build with large language models every day, which is exactly how I know
      where they break. I've also built tools that run AI entirely on local
      hardware. The useful part is rarely the model; it's
      fitting it into a real workflow with guardrails, sources and a human in the
      loop. I can add AI to a product you have, or automate the tedious part of
      your business.
    gets:
      - An honest read on where AI helps your product and where it doesn't
      - Features built on Claude and other models, with sourcing and review
      - Agents and automations that work inside your existing tools
      - Private, on-device AI when your data can't leave the building
    examples: [cardinal, voice, cage, talker]

  - key: rescue
    icon: wrench
    title: Rescue & Modernization
    short: Inherited a tangled codebase? I find the load-bearing weirdness and fix it.
    body: >-
      Plenty of good businesses run on code nobody wants to touch. I walk into
      existing applications, map what's actually going on, add the tests that
      make change safe, and upgrade, untangle or rebuild the pieces that hold you
      back, without stopping the business while I do it.
    gets:
      - A written assessment of what's healthy, risky and urgent
      - Framework and dependency upgrades (Rails, Ruby, JavaScript)
      - Test coverage around the parts that make money
      - Performance and reliability fixes you can measure
    examples: [rsow]

  - key: leadership
    icon: compass
    title: Technical Leadership
    short: A seasoned head of development, for an architecture review or a few months.
    body: >-
      I've been a CTO, a co-founder and a head of development, and I helped build
      a coding bootcamp. If you're a founder without a technical
      partner, or a small team that needs senior judgment, I can review your
      architecture, set up the engineering basics, help you hire and mentor the
      people you have.
    gets:
      - Architecture and code reviews with plain-English findings
      - Roadmaps, estimates and build-or-buy calls you can defend
      - Code review, CI and team habits that keep quality up
      - Interviewing, hiring help and mentoring
    examples: []

  - key: small-business
    icon: store
    title: Small Business Sites & Tools
    short: Fast sites, booking and request forms, and little tools that save hours.
    body: >-
      Not every project needs a platform. Sometimes the win is a fast, good-looking
      site that's cheap to host, a request form that lands in your inbox, or a
      small tool that does in seconds what used to eat an afternoon. I build those
      too, with the same care.
    gets:
      - A fast site you own outright, hosted for little or nothing
      - Request, quote and contact forms that reach you
      - Small internal tools and spreadsheets-to-software upgrades
      - Help leaving platforms that won't let you go
    examples: [tinkered-tactile, rsow]

