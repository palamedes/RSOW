---
layout: default
---
<div class="archive">
  <h1>{{ page.title }}</h1>
  <ul class="post-list">
    {% assign listed = page.posts | where_exp: "p", "p.archive != false" %}
    {% for post in listed %}
    <li>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
