name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuilds so future-dated posts appear on their date. The site's
  # timezone is America/New_York, so a post dated today counts from midnight
  # Eastern.
  #
  # These are plain UTC crons on purpose. Oct 5-8, 2026 the schedule used
  # GitHub's newer per-entry `timezone:` setting, and its runs came 5-9 hours
  # late or not at all, while a plain-UTC daily schedule in github/docs ran
  # within minutes on the same days. The times avoid the top of the hour
  # (GitHub's busiest moment for schedules) and stay after midnight Eastern
  # in both EDT and EST:
  #   05:17 UTC = 1:17 AM EDT / 12:17 AM EST   (the one that publishes)
  #   09:17 UTC = 5:17 AM EDT /  4:17 AM EST   (backup)
  #   12:17 UTC = 8:17 AM EDT /  7:17 AM EST   (backup)
  #   16:17 UTC = 12:17 PM EDT / 11:17 AM EST  (backup)
  # A rebuild with nothing new to publish changes nothing.
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 9 * * *"
    - cron: "17 12 * * *"
    - cron: "17 16 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
