name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Daily rebuilds so future-dated posts appear on their date (the site
  # timezone is America/New_York, so a post dated today counts from midnight
  # Eastern). GitHub runs schedules best-effort: it dropped the Oct 6, 2026
  # run outright and ran the Oct 7 ones 6-9 hours late. So the first run is
  # just after midnight and the rest are backups every few hours; with a
  # delay like that a post still lands by morning, and a rebuild with nothing
  # new changes nothing.
  schedule:
    - cron: "15 0 * * *"
      timezone: "America/New_York"
    - cron: "0 3 * * *"
      timezone: "America/New_York"
    - cron: "0 6 * * *"
      timezone: "America/New_York"
    - cron: "0 8 * * *"
      timezone: "America/New_York"
    - cron: "0 10 * * *"
      timezone: "America/New_York"
    - cron: "0 12 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
